name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build and package release in Python 3.13 container
        run: |
          docker run --rm \
            -e VERSION="${GITHUB_REF_NAME#v}" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            python:3.13-bookworm@sha256:2383bb1108fe80f7191b1f3ddbbd2ce1a13a1e99e7400a42fa28b27defa34841 \
            bash -lc '
              apt-get update &&
              apt-get install -y --no-install-recommends build-essential ffmpeg git mpv patchelf &&
              python -m venv venv &&
              venv/bin/pip install --upgrade pip &&
              venv/bin/pip install -r requirements.txt -r requirements-dev.txt &&
              venv/bin/python build_nuitka.py --clean --onefile &&
              bash scripts/package-release.sh "$VERSION"
            '

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: fila-*-linux-x86_64.tar.gz
