name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build and package release in Arch container
        run: |
          docker run --rm \
            --pull=always \
            -e VERSION="${GITHUB_REF_NAME#v}" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            archlinux:latest \
            bash -lc '
              pacman -Sy --noconfirm archlinux-keyring &&
              pacman -Syu --noconfirm --needed python python-pip git base-devel patchelf mpv ffmpeg &&
              python -m venv venv &&
              venv/bin/pip install --upgrade pip &&
              venv/bin/pip install -r requirements.txt -r requirements-dev.txt &&
              venv/bin/python build_nuitka.py --clean --onefile &&
              bash scripts/package-release.sh "$VERSION"
            '

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: fila-*-linux-x86_64.tar.gz
